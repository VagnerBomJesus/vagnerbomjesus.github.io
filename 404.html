  <header class="site-header">

      <a href="/" class="brand" aria-label="Vagner Bom Jesus - home">
        <svg class="brand__mark" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M12 14l8 20 8-20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M30 14v20" fill="none" stroke="#9A01A2" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M30 14h4a4 4 0 0 1 0 8h-4M30 22h5a4 4 0 0 1 0 8h-5" fill="none" stroke="#9A01A2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand__text">VBJ</span>

      <nav class="site-nav" aria-label="Main navigation">
        <ul class="site-nav__list">

        </ul>
      </nav>
    </div>
  </header>

  <main class="error-page">
    <div>
      <div class="error-code">4<span>0</span>4</div>
      <h1 class="error-title">Page not found</h1>
      <p class="error-desc">The page you are looking for does not exist or has been moved.</p>
      <span class="error-path" id="error-path"></span>
      <div class="error-actions">
        <a href="/" class="btn btn--solid">Back to portfolio</a>
        <a href="/#contact" class="btn">Contact me</a>
      </div>
      <p class="error-countdown">Redirecting to the homepage in <strong id="countdown-num">15</strong>s&hellip;</p>
    </div>
  </main>
  <script>
    (function () {
      var p = document.getElementById('error-path');
      if (p) p.textContent = location.pathname + location.search;
      var n = 15, el = document.getElementById('countdown-num');
      var timer = setInterval(function () {
        n -= 1; if (el) el.textContent = String(n);
        if (n <= 0) { clearInterval(timer); location.href = '/'; }
      }, 1000);
    })();
  </script>

  <footer class="site-footer" role="contentinfo">
